<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireMapper — European Wildfire Evolution</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading European wildfire data…</span>
    </div>
    <div id="header"></div>
    <!-- Hidden until boot finishes: tapping ⚙ into an unmounted registry
         would open an empty layer list. shell.ts reveals it. -->
    <nav id="rail" class="hidden">
      <button id="rail-layers" type="button" aria-label="Layers">⚙</button>
      <button id="rail-search" type="button" aria-label="Find a fire">🔍</button>
      <button id="rail-info" type="button" aria-label="Data freshness and sources">ℹ</button>
      <!-- /scale, not /scale.html: Workers Assets defaults html_handling to
           auto-trailing-slash, so the extensionless path is canonical and
           /scale.html merely 307s onto it. Both resolve; this one saves a hop.
           A real <a>, not a rail view: /scale is its own page/bundle, not a
           client-side nav.push() entry in this SPA's view stack. Was a text
           link buried at the bottom of the layers sidebar — a reader had to
           open the gear menu and scroll to find it. -->
      <a id="rail-scale" href="/scale" aria-label="How much has burned this year?">📊</a>
    </nav>
    <!-- Distinct feature from #rail-scale/#rail above: this is an on-map H3
         "scale comparison" blob (layer_scale_blob.ts), not the /scale page's
         EFFIS burned-area stats. Top-level like #compare-bar/#view-chip, not
         inside #rail (a fixed icon strip) or #sidebar (registry.ts's layer
         switcher) — main.ts wires its click handler directly.

         The button and its caption share ONE positioned wrapper so the pair
         can only ever be placed as a unit — a separately-positioned caption is
         a second box to keep clear of #header and #fire-readout, and it would
         drift the first time either offset changed. -->
    <div id="scale-blob-control">
      <button id="scale-blob-toggle" type="button" aria-pressed="false" title="Compare fire scale">
        Compare fire scale
      </button>
      <!-- Binding constraint from the design spec's Global Constraints: the
           copy must say "detected fire footprint, archived fires only", never
           "actually burned" or "all fires". The shape is what satellites
           DETECTED, and it holds only fires already archived — still-burning
           fires, fires quiet for less than 48 h, and fires under 4 detections
           are all absent. Without this line the reader sees a large mass of
           real fire outlines and has no way to know it is a partial one.
           A separate element, not part of the button's label: main.ts's
           wireScaleBlobToggle assigns the button's textContent on every state
           change, which would delete any child node placed inside it. -->
      <p id="scale-blob-note">Detected fire footprint, archived fires only</p>
    </div>
    <!-- One container for every non-map view. data-view picks which child
         shows; data-size is the fire card's peek/full state on mobile. -->
    <div id="view" data-view="map">
      <div id="view-bar"></div>
      <aside id="sidebar">
        <div id="layers"></div>
        <div id="legend"></div>
      </aside>
      <div id="panel" class="hidden"></div>
      <div id="info"></div>
    </div>
    <button id="view-chip" type="button">‹ Map</button>
    <!-- Compare's chrome lives OUTSIDE #view: compare shows the bare map with
         the swipe divider, so #view is hidden for it — a back bar rendered
         inside would be hidden along with it. -->
    <div id="compare-bar"></div>
    <!-- Top level, not inside #sidebar: compare hides #view, so a strip nested
         in the sidebar would vanish exactly when compare needs to describe
         itself. The way OUT of compare is #compare-bar's back control. -->
    <div id="notice"></div>
    <div id="timeline"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
