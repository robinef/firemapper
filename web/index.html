<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FireMapper — European Wildfire Evolution</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="map"></div>
    <div id="loading">
      <div class="spinner"></div>
      <span>Loading European wildfire data…</span>
    </div>
    <div id="header"></div>
    <div id="banner"></div>
    <aside id="sidebar">
      <!-- The only entry point that survives the rolling windows: every other
           route into a fire's card needs you to know where it burned, or to
           catch it before its marker disappears. -->
      <button id="find-fire" type="button">Find a fire…</button>
      <div id="layers"></div>
      <div id="notice"></div>
      <div id="legend"></div>
      <!-- /scale, not /scale.html: Workers Assets defaults html_handling to
           auto-trailing-slash, so the extensionless path is canonical and
           /scale.html merely 307s onto it. Both resolve; this one saves a hop. -->
      <a id="scale-link" href="/scale">How much has burned this year?</a>
    </aside>
    <div id="panel" class="hidden"></div>
    <div id="timeline"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
