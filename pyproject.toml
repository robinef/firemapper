[project]
name = "firemaper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "contourpy>=1.3.3",
    "duckdb>=1.0",
    "h3>=4.0",
    "pyarrow>=16",
    "requests>=2.32",
]

[project.optional-dependencies]
meteosat = ["eumdac>=3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
