name: refresh-fast

# Live layers only: MTG FRP (10-minute cadence), wind and aircraft, re-clustered
# against the archive already in R2. Needs no API key.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# queue: max is load-bearing. The default (`single`) CANCELS an older pending
# run, so the hourly full refresh would be discarded by the next fast run every
# time the two collide. Cannot be combined with cancel-in-progress: true.
concurrency:
  group: refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Reverse-geocoding source for fire and scar labels. Without it run.py
      # falls back to places=[] and every derived scar is named
      # "Burn scar · <date>" with place=null, which makes the past-scar list
      # useless for finding one particular fire. Cached because the file
      # changes rarely and the fast tier runs every 15 minutes.
      - uses: actions/cache@v4
        with:
          path: data/places
          key: geonames-cities15000-v1
      - name: Ensure the places gazetteer is present
        run: |
          test -f data/places/cities15000.txt || {
            mkdir -p data/places
            curl -sSfL https://download.geonames.org/export/dump/cities15000.zip -o /tmp/cities.zip
            unzip -o /tmp/cities.zip -d data/places
          }
          # Logged, not pinned. GeoNames regenerates the archive daily, so a
          # fixed checksum would fail the refresh within a day; this leaves the
          # digest in the run record so a swap is auditable after the fact.
          # load_places() enforces a plausibility floor and refuses a truncated
          # or wrong file outright.
          sha256sum data/places/cities15000.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - run: uv run python -m scripts.refresh_remote fast
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
