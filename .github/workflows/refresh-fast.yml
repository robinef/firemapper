name: refresh-fast

# Live layers only: MTG FRP (10-minute cadence), wind and aircraft, re-clustered
# against the archive already in R2. Needs no API key.
on:
  # FALLBACK ONLY. The real cadence comes from a Cloudflare Cron Trigger calling
  # workflow_dispatch below (see worker/index.ts): GitHub throttles scheduled
  # workflows on public repos badly enough that this schedule was fiction —
  # measured over 52.8 h on 2026-08-04, "*/15" produced 30 runs against 211
  # nominal, median gap 81 min, worst 232.
  #
  # Every six hours, not hourly. `queue: max` means a colliding run is QUEUED,
  # never discarded, and this group is strictly serial — so an hourly fallback
  # is not free insurance, it is ~14 min of every 60 spent re-doing what the
  # Worker already did. Together with two Worker-driven runs and refresh-full
  # that came to ~58 min of work per 60-min hour: saturation, where any slow run
  # pushes the queue permanently backwards and the cadence gets LESS regular.
  #
  # Six-hourly still catches a dead Worker or an expired token within one cycle,
  # which is the job. Offset from refresh-full's ":07" so they do not collide.
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

# queue: max is load-bearing. The default (`single`) CANCELS an older pending
# run, so the hourly full refresh would be discarded by the next fast run every
# time the two collide. Cannot be combined with cancel-in-progress: true.
concurrency:
  group: refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # Reverse-geocoding source for fire and scar labels. Without it run.py
      # falls back to places=[] and every derived scar is named
      # "Burn scar · <date>" with place=null, which makes the past-scar list
      # useless for finding one particular fire. Cached because the file
      # changes rarely and the fast tier runs every 15 minutes.
      - uses: actions/cache@v4
        with:
          path: data/places
          key: geonames-cities15000-v1
      - name: Ensure the places gazetteer is present
        run: |
          test -f data/places/cities15000.txt || {
            mkdir -p data/places
            curl -sSfL https://download.geonames.org/export/dump/cities15000.zip -o /tmp/cities.zip
            unzip -o /tmp/cities.zip -d data/places
          }
          # Logged, not pinned. GeoNames regenerates the archive daily, so a
          # fixed checksum would fail the refresh within a day; this leaves the
          # digest in the run record so a swap is auditable after the fact.
          # load_places() enforces a plausibility floor and refuses a truncated
          # or wrong file outright.
          sha256sum data/places/cities15000.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - run: uv run python -m scripts.refresh_remote fast
        env:
          # HD before/after: Sentinel-2 at 10 m instead of the keyless MODIS
          # 250 m default. A flag, NOT a credential — the Sentinel Hub instance
          # id is a bearer token for a whole OGC configuration and lives only in
          # the Worker (see worker/index.ts and docs/DEPLOYMENT.md). This job
          # holds R2 write credentials; it has no business holding that one too.
          SENTINELHUB_PROXY: "1"
          SENTINELHUB_LAYER: TRUE_COLOR
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
