name: refresh-fast

# Live layers only: MTG FRP (10-minute cadence) and wind, re-clustered
# against the archive already in R2. Needs no API key.
on:
  # FALLBACK ONLY. The real cadence comes from a Cloudflare Cron Trigger calling
  # workflow_dispatch below (see worker/index.ts): GitHub throttles scheduled
  # workflows on public repos badly enough that this schedule was fiction —
  # measured over 52.8 h on 2026-08-04, "*/15" produced 30 runs against 211
  # nominal, median gap 81 min, worst 232.
  #
  # Every six hours, not hourly. `queue: max` means a colliding run is QUEUED,
  # never discarded, and this group is strictly serial — so an hourly fallback
  # is not free insurance, it is another full run re-doing what the Worker
  # already did. Measured over 18 h to 2026-08-05: refresh-fast 10.5-18.7 min
  # (median 13.2), refresh-full 11.6-17.9. Two Worker-driven runs plus
  # refresh-full already fill ~41 min of every 60, and 55 at their worst; adding
  # an hourly fallback puts the median at ~55 and the worst case past 60 —
  # saturation, where any slow run pushes the queue permanently backwards and
  # the cadence gets LESS regular.
  #
  # Six-hourly still catches a dead Worker or an expired token within one cycle,
  # which is the job. ":37" clears refresh-full's ":07" outright. It does still
  # land inside a half-hourly Worker run (":30" plus a 13-min median), which is
  # accepted rather than designed out: `queue: max` makes that a queued run, not
  # a discarded one, so the cost is one redundant refresh four times a day — the
  # premium on insurance that has to fire whether or not the Worker is alive.
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

# queue: max is load-bearing. The default (`single`) CANCELS an older pending
# run, so the hourly full refresh would be discarded by the next fast run every
# time the two collide. Cannot be combined with cancel-in-progress: true.
concurrency:
  group: refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The fast tier ran ~14 min while the MTG FRP fetch was failing fast. With
    # that fetch restored it does real work on ~17k pixels and overran 20 min,
    # and a timeout kill publishes NOTHING — so the map froze on the last
    # pre-fix generation while every layer still reported its old failure. The
    # ceiling has to sit above the honest cost of a run, not the degraded one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # v9.0.0, NOT v9 — astral stopped publishing bare-major tags after v7, so
      # `@v9` resolves to nothing and the job dies in 3 s with "unable to find
      # version". Confirmed against the remote: refs/tags/v7 exists, v8 and v9
      # do not. This has to move by exact version; Dependabot does that.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          # v9 flipped `prune-cache` to false by default, to spare PyPI the
          # re-downloads that pruning causes. Kept at the new default rather
          # than pinned back to true: the point of the change is upstream load,
          # and this workflow is one of its heaviest callers at half-hourly.
          # The cost lands on GitHub's 10 GB per-repo cache, which evicts
          # least-recently-used — so if the gazetteer cache below starts missing
          # and the GeoNames download reappears in every run, an unpruned uv
          # cache crowding it out is the first thing to check.
          enable-cache: true
      - run: uv sync
      # Reverse-geocoding source for fire and scar labels. Without it run.py
      # falls back to places=[] and every derived scar is named
      # "Burn scar · <date>" with place=null, which makes the past-scar list
      # useless for finding one particular fire. Cached because the file
      # changes rarely and the fast tier runs every half hour.
      - uses: actions/cache@v6
        with:
          path: data/places
          key: geonames-cities15000-v1
      - name: Ensure the places gazetteer is present
        run: |
          test -f data/places/cities15000.txt || {
            mkdir -p data/places
            curl -sSfL https://download.geonames.org/export/dump/cities15000.zip -o /tmp/cities.zip
            unzip -o /tmp/cities.zip -d data/places
          }
          # Logged, not pinned. GeoNames regenerates the archive daily, so a
          # fixed checksum would fail the refresh within a day; this leaves the
          # digest in the run record so a swap is auditable after the fact.
          # load_places() enforces a plausibility floor and refuses a truncated
          # or wrong file outright.
          sha256sum data/places/cities15000.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - run: uv run python -m scripts.refresh_remote fast
        env:
          # Python buffers stdout when it is a pipe, which a runner always is.
          # A job killed by the timeout never flushes, so a 20-minute stall
          # reached the log as ZERO lines — no stage timings, no way to tell a
          # slow run from a hung one after the fact. Unbuffered, GitHub stamps
          # each [info] line with its own timestamp and the log becomes the
          # profile.
          PYTHONUNBUFFERED: "1"
          # HD before/after: Sentinel-2 at 10 m instead of the keyless MODIS
          # 250 m default. A flag, NOT a credential — the Sentinel Hub instance
          # id is a bearer token for a whole OGC configuration and lives only in
          # the Worker (see worker/index.ts and docs/DEPLOYMENT.md). This job
          # holds R2 write credentials; it has no business holding that one too.
          SENTINELHUB_PROXY: "1"
          SENTINELHUB_LAYER: TRUE_COLOR
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
