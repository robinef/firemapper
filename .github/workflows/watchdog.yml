name: watchdog

# Every other alarm lives inside worker/index.ts and therefore dies with it.
# This one runs on the other provider and asks what a visitor would ask: is the
# published map still advancing? It goes through the PUBLIC url, not R2, so a
# healthy bucket behind a broken Worker still reads as broken.
#
# :23 past rather than :00 — the top of the hour is where every scheduled job on
# the platform piles up, and GitHub throttles scheduled runs hardest there.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      manifest_url:
        description: >-
          Drill only. Point the check at a different manifest to exercise the
          alarm path on demand. Use the committed stale fixture:
          https://raw.githubusercontent.com/robinef/firemapper/main/tests/fixtures/stale_manifest.json
          Leave blank to check production.
        required: false
        default: ""

# Its own group. Sharing `refresh` would queue the watchdog behind the very
# thing it is meant to be watching, which is exactly how it would go quiet at
# the moment it mattered.
concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - id: check
        # continue-on-error so the issue steps below still run; the job is
        # failed explicitly at the end, so the run still goes red.
        continue-on-error: true
        env:
          # Blank falls through to the production default in the script, so a
          # normal scheduled run is unaffected. Non-blank is a drill.
          WATCHDOG_MANIFEST_URL: ${{ inputs.manifest_url }}
        run: python3 scripts/watchdog.py
        # Deliberately the runner's bare python3 and stdlib only: no uv sync, no
        # dependency resolution, no lockfile. A watchdog that needs a working
        # toolchain to report a broken system has more ways to go quiet than the
        # thing it watches.

      - name: Open or update the tracking issue
        if: steps.check.outputs.verdict != 'fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETAIL: ${{ steps.check.outputs.detail }}
          LIMIT: ${{ steps.check.outputs.limit }}
          CHECKED: ${{ steps.check.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='[watchdog] data is stale'
          # Dedupe on the exact title: at hourly cadence a multi-day outage
          # would otherwise open dozens of issues, and an alarm that buries you
          # is one you mute.
          # List and filter locally rather than --search: GitHub's search index
          # lags by up to a minute, so during an outage the dedupe lookup would
          # miss the issue it just opened and open another one every hour.
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          BODY="The published map has stopped advancing: **${DETAIL}** (limit ${LIMIT} min).

          Nothing inside the Worker can report this — if the Worker or its cron is gone there are no invocations to fail. That is why this check runs here.

          Where to look, in order:
          1. Cloudflare → the Worker → Cron Events (is it firing at all?)
          2. \`GH_DISPATCH_TOKEN\` expiry — fine-grained PATs cap at ~1 year
          3. The most recent \`refresh-fast\` / \`refresh-full\` run logs

          Checked \`${CHECKED}\` via ${RUN_URL}"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the tracking issue on recovery
        if: steps.check.outputs.verdict == 'fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE='[watchdog] data is stale'
          # List and filter locally rather than --search: GitHub's search index
          # lags by up to a minute, so during an outage the dedupe lookup would
          # miss the issue it just opened and open another one every hour.
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Recovered — the manifest is advancing again. Closed by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$NUM"
          fi

      # The full tier's own alarm, on its own issue: the fast tier keeps the
      # manifest fresh on its own, so a dead refresh-full never trips the one
      # above. "skipped" (manifest unreadable) touches neither this issue nor
      # its closing — that outage is already reported above.
      - name: Open or update the full-refresh issue
        if: steps.check.outputs.full_verdict == 'stale' || steps.check.outputs.full_verdict == 'broken'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DETAIL: ${{ steps.check.outputs.full_detail }}
          LIMIT: ${{ steps.check.outputs.full_limit }}
          CHECKED: ${{ steps.check.outputs.full_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='[watchdog] full refresh is stale'
          # Same local-filter dedupe as the stale-data issue above.
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          BODY="The full refresh tier has stopped publishing: the season summary is **${DETAIL}** (limit ${LIMIT} min). The live layers may still look fine — the fast tier keeps the manifest fresh on its own — but the FIRMS archive top-up, EFFIS, imagery and the \"Burned this year\" layer are frozen.

          Where to look, in order:
          1. Cloudflare → the Worker → Cron Events: is the \`17 */2 * * *\` trigger firing?
          2. The most recent \`refresh-full\` run logs (the \`refresh\` concurrency group is serial; a stuck run blocks the queue)
          3. \`GH_DISPATCH_TOKEN\` expiry

          Checked \`${CHECKED}\` via ${RUN_URL}"
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Close the full-refresh issue on recovery
        if: steps.check.outputs.full_verdict == 'fresh'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE='[watchdog] full refresh is stale'
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Recovered — the full tier is publishing again. Closed by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            gh issue close "$NUM"
          fi

      - name: Fail the run when the map is not advancing
        if: steps.check.outputs.verdict != 'fresh' || steps.check.outputs.full_verdict != 'fresh'
        run: |
          echo "watchdog verdict: ${{ steps.check.outputs.verdict }}, full tier: ${{ steps.check.outputs.full_verdict }}" >&2
          exit 1
