name: backfill-season
# One-off trigger for scripts/backfill_season.py — rebuilds January-June 2026
# fires from the FIRMS Standard Processing archive into the permanent track
# archive (data/archive/tracks/), which the "Burned this year" season layer
# reads. Manual only. Safe to delete once the publish run has landed.
#
# Two jobs. `build` fetches + clusters (the long part) and reads R2 only — the
# live index and season cells file for the clobber guard — so it stays OUT of
# the refresh queue. `publish` (dry_run=false only) uploads that exact build
# artifact and joins the `refresh` concurrency group: a refresh re-uploads the
# whole index it hydrated, so one running beside the merge would overwrite the
# merged index and orphan every backfilled track.
#
# `rollback=true` runs ONLY the `rollback` job (build and publish are skipped):
# it downloads the `backfill-season` artifact of the publish run named by
# `rollback_run_id` and removes exactly those ids from the live index and the
# season/scale files, inside the same `refresh` group. With dry_run=true (the
# default) it prints the plan and writes nothing.
on:
 workflow_dispatch:
  inputs:
   dry_run:
    description: "Dry run (build and report only; nothing written to R2)"
    type: boolean
    default: true
   modis:
    description: "Also fetch MODIS_SP"
    type: boolean
    default: false
   rollback:
    description: "Roll back a published backfill instead of building (see rollback_run_id)"
    type: boolean
    default: false
   rollback_run_id:
    description: "Run id of the publish run whose artifact lists the ids to roll back"
    type: string
    default: ""
# Least privilege: each job only reads the repo. A job that needs more
# declares its own `permissions`, which replaces this block.
permissions:
  contents: read

jobs:
 build:
  if: ${{ !inputs.rollback }}
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v7
   - uses: astral-sh/setup-uv@v10.1.0
     with:
      enable-cache: true
   - run: uv sync
   - name: Build the backfill (read-only against R2)
     timeout-minutes: 55
     run: uv run python -m scripts.backfill_season --preview-season ${{ inputs.modis && '--modis' || '' }}
     env:
      PYTHONUNBUFFERED: "1"
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
   - name: Job summary
     if: always()
     run: test -f data/backfill/out/summary.md && cat data/backfill/out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
   - uses: actions/upload-artifact@v7
     if: always()
     with:
      name: backfill-season
      path: data/backfill/out/
      if-no-files-found: ignore
 publish:
  needs: build
  if: ${{ !inputs.dry_run && !inputs.rollback }}
  runs-on: ubuntu-latest
  timeout-minutes: 30
  concurrency:
   group: refresh
   cancel-in-progress: false
   queue: max
  steps:
   - uses: actions/checkout@v7
   - uses: astral-sh/setup-uv@v10.1.0
     with:
      enable-cache: true
   - run: uv sync
   - uses: actions/download-artifact@v8
     with:
      name: backfill-season
      path: data/backfill/out/
   - name: Publish the build to R2
     timeout-minutes: 25
     run: uv run python -m scripts.backfill_season --publish
     env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

 rollback:
  if: ${{ inputs.rollback }}
  runs-on: ubuntu-latest
  timeout-minutes: 20
  permissions:
   contents: read
   actions: read  # download another run's artifact
  concurrency:
   group: refresh
   cancel-in-progress: false
   queue: max
  steps:
   - uses: actions/checkout@v7
   - uses: astral-sh/setup-uv@v10.1.0
     with:
      enable-cache: true
   - run: uv sync
   # Any run in the repo can upload an artifact called backfill-season (a
   # fork PR's CI run, say). Only a manual dispatch of THIS workflow on main
   # may name the ids to delete from prod. Inputs reach the shell via env only.
   - name: Check the run is a backfill-season dispatch on main
     env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.rollback_run_id }}
      REPO: ${{ github.repository }}
     run: |
      case "$RUN_ID" in ''|*[!0-9]*) echo "rollback_run_id must be a numeric run id"; exit 1;; esac
      gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '[.path, .event, .head_branch] | @tsv' > run.tsv
      IFS=$'\t' read -r path event branch < run.tsv
      echo "run $RUN_ID: path=$path event=$event branch=$branch"
      case "$path" in *.github/workflows/backfill-season.yml) ;; *) echo "not a backfill-season run"; exit 1;; esac
      [ "$event" = workflow_dispatch ] || { echo "not a workflow_dispatch run"; exit 1; }
      [ "$branch" = main ] || { echo "not a run on main"; exit 1; }
   - uses: actions/download-artifact@v8
     with:
      name: backfill-season
      path: data/backfill/published/
      run-id: ${{ inputs.rollback_run_id }}
      github-token: ${{ github.token }}
   - name: Roll the backfill back out of R2
     timeout-minutes: 15
     run: uv run python -m scripts.backfill_season --rollback data/backfill/published ${{ inputs.dry_run && '--dry-run' || '' }}
     env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
