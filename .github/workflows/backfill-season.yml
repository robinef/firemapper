name: backfill-season
# One-off trigger for scripts/backfill_season.py — rebuilds January-June 2026
# fires from the FIRMS Standard Processing archive into the permanent track
# archive (data/archive/tracks/), which the "Burned this year" season layer
# reads. Manual only. Safe to delete once the publish run has landed.
#
# Two jobs. `build` fetches + clusters (the long part) and reads R2 only — the
# live index and season cells file for the clobber guard — so it stays OUT of
# the refresh queue. `publish` (dry_run=false only) uploads that exact build
# artifact and joins the `refresh` concurrency group: a refresh re-uploads the
# whole index it hydrated, so one running beside the merge would overwrite the
# merged index and orphan every backfilled track.
on:
 workflow_dispatch:
  inputs:
   dry_run:
    description: "Dry run (build and report only; nothing written to R2)"
    type: boolean
    default: true
   modis:
    description: "Also fetch MODIS_SP"
    type: boolean
    default: false
jobs:
 build:
  runs-on: ubuntu-latest
  timeout-minutes: 60
  steps:
   - uses: actions/checkout@v7
   - uses: astral-sh/setup-uv@v10.1.0
     with:
      enable-cache: true
   - run: uv sync
   - name: Build the backfill (read-only against R2)
     timeout-minutes: 55
     run: uv run python -m scripts.backfill_season --preview-season ${{ inputs.modis && '--modis' || '' }}
     env:
      PYTHONUNBUFFERED: "1"
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
   - name: Job summary
     if: always()
     run: test -f data/backfill/out/summary.md && cat data/backfill/out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
   - uses: actions/upload-artifact@v7
     if: always()
     with:
      name: backfill-season
      path: data/backfill/out/
      if-no-files-found: ignore
 publish:
  needs: build
  if: ${{ !inputs.dry_run }}
  runs-on: ubuntu-latest
  timeout-minutes: 30
  concurrency:
   group: refresh
   cancel-in-progress: false
   queue: max
  steps:
   - uses: actions/checkout@v7
   - uses: astral-sh/setup-uv@v10.1.0
     with:
      enable-cache: true
   - run: uv sync
   - uses: actions/download-artifact@v8
     with:
      name: backfill-season
      path: data/backfill/out/
   - name: Publish the build to R2
     timeout-minutes: 25
     run: uv run python -m scripts.backfill_season --publish
     env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
