name: deploy

# Code-only. Data reaches the site through R2, never through a deploy, so this
# runs on pushes and nothing else.
#
# SENTINELHUB_INSTANCE_ID is deliberately absent: it is a WMS access token that
# would be baked into the public artifact and spend someone else's quota.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
