name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    name: pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Run tests
        # uv syncs the pyproject deps into an ephemeral env, adds pytest, runs it.
        # DuckDB pulls the spatial + h3 community extensions over the network.
        run: uv run --with pytest pytest -q

  web:
    name: web (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24, not 20. Node 20 is past end-of-life and GitHub already forces
          # actions off it onto 24 — so the runner disagreed with this pin, and
          # only the test job still ran on 20. It is also a hard blocker for
          # dependency updates rather than a tidiness issue: jsdom 30 declares
          # `^22.22.2 || ^24.15.0 || >=26.0.0`, and its undici 8 needs >=22.19,
          # so on 20 the suite dies with `webidl.util.markAsUncloneable is not a
          # function` before a single assertion runs.
          #
          # Nothing else in the repo pins a Node version — the Worker runs on
          # Cloudflare's own runtime, not this one — so this line is the whole
          # constraint.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      # Build in CI, and then check what it actually emitted.
      #
      # maplibre 6 fetches its worker by URL at runtime, from a specifier built
      # at runtime — so Vite cannot see it statically and will not emit it
      # unless vite.config.ts copies it. When that broke, tsc, all 233 tests AND
      # a successful production build were green while the deployed map
      # requested /assets/maplibre-gl-worker.mjs and got a 404. Nothing in the
      # suite can catch that, because the failure is in the shape of the output
      # directory rather than in any module the tests import.
      #
      # maplibre-gl-shared.mjs is the second half: both the worker and the main
      # entry import it as a relative sibling, so a worker without it 404s in
      # turn.
      - name: Build
        run: npm run build
      - name: Assert maplibre was emitted beside the bundle, and stayed external
        run: |
          entry=$(find dist/assets -name 'index-*.js' | head -1)
          entry_dir=$(dirname "$entry")
          for f in maplibre-gl.mjs maplibre-gl-worker.mjs maplibre-gl-shared.mjs; do
            test -f "$entry_dir/$f" || {
              echo "::error::$f missing from $entry_dir - the map would load without a worker"
              exit 1
            }
          done
          # The entry must IMPORT maplibre rather than contain it. If `external`
          # is ever dropped, the files above are still copied and every check
          # here would pass while `shared` silently ships twice — inlined in the
          # app chunk and again as a sibling, ~100 kB gzip of duplication. This
          # is the only assertion that notices.
          grep -q '/assets/maplibre-gl.mjs' "$entry" || {
            echo "::error::$entry does not import /assets/maplibre-gl.mjs - maplibre got bundled again"
            exit 1
          }
