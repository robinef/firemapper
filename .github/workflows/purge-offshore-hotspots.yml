name: purge-offshore-hotspots
# One-off maintenance trigger for scripts/purge_offshore_hotspots.py — removes
# already-ingested open-water FIRMS detections (sun glint, ships, gas flares —
# classified via a land/sea mask on the stored lat/lon, since FIRMS's NRT area
# API has no field to tell them apart) from the R2 archive so they stop
# clustering into visible events. Manual only: this is a single retroactive
# cleanup, not a recurring job. Safe to delete once it has been run against prod.
on:
 workflow_dispatch:
  inputs:
   dry_run:
    description: "Dry run (report matches, do not delete or upload)"
    type: boolean
    default: true
concurrency:
 group: refresh
 cancel-in-progress: false
 queue: max
jobs:
 purge:
  runs-on: ubuntu-latest
  timeout-minutes: 40
  steps:
   - uses: actions/checkout@v7
   - uses: astral-sh/setup-uv@v10.0.1
     with:
      enable-cache: true
   - run: uv sync
   - run: uv run python -m scripts.purge_offshore_hotspots ${{ inputs.dry_run && '--dry-run' || '' }}
     env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
