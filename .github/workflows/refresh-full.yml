name: refresh-full

# Everything the fast tier does, plus the polar (VIIRS/MODIS) archive top-up,
# EFFIS burned areas and GIBS scar imagery. Runs at :07 so it does not land on
# the same minute as every fourth fast run.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false
  queue: max

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      # A missing FIRMS_MAP_KEY fails this job by design: publishing an empty
      # archive is what put a 30-day timeline of zeroes on the live map.
      - run: uv run python -m scripts.refresh_remote full
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
